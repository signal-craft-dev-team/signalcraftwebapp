name: Build and Deploy to Cloud Run

on:
  push:
    branches: [v001-dev]

env:
  GHCR_IMAGE:   ghcr.io/signal-craft-dev-team/signalcraftwebapp
  GAR_IMAGE:    asia-northeast3-docker.pkg.dev/signalcraft-ver-1-202605/user-dashboard/user-dashboard
  REGION:       asia-northeast3
  SERVICE:      user-dashboard
  PROJECT:      signalcraft-ver-1-202605
  SA_EMAIL:     user-dashboard-runner@signalcraft-ver-1-202605.iam.gserviceaccount.com

jobs:
  # ─────────────────────────────────────────
  # 1. Docker 빌드 & GHCR 푸시
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # 2. Cloud Run 배포
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/55721952249/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ env.SA_EMAIL }}

      - name: gcloud 설정
        uses: google-github-actions/setup-gcloud@v2

      - name: GHCR → GAR 이미지 복사
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker pull ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.GHCR_IMAGE }}:${{ github.sha }} ${{ env.GAR_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.GHCR_IMAGE }}:${{ github.sha }} ${{ env.GAR_IMAGE }}:latest
          docker push ${{ env.GAR_IMAGE }}:${{ github.sha }}
          docker push ${{ env.GAR_IMAGE }}:latest

      - name: Cloud Run Service 배포
        run: |
          gcloud run services deploy ${{ env.SERVICE }} \
            --image=${{ env.GAR_IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT }} \
            --service-account=${{ env.SA_EMAIL }} \
            --port=8080 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --allow-unauthenticated \
            --set-env-vars="\
          VITE_API_URL=${{ secrets.VITE_API_URL }},\
          VITE_USE_MOCK_API=false,\
          VITE_X_AUTH_ID=${{ secrets.VITE_X_AUTH_ID }},\
          VITE_X_AUTH_PROVIDER=${{ secrets.VITE_X_AUTH_PROVIDER }},\
          VITE_X_CUSTOMER_ID=${{ secrets.VITE_X_CUSTOMER_ID }},\
          VITE_PLACE_ID=${{ secrets.VITE_PLACE_ID }}"

  # ─────────────────────────────────────────
  # 3. Slack 알림
  # ─────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()

    steps:
      - name: Send Slack message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy.result == 'success' && '✅ 배포 성공' || '❌ 배포 실패' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy.result == 'success' && ':white_check_mark: *배포 성공*' || ':x: *배포 실패*' }}\n*서비스:* user-dashboard (Cloud Run)\n*브랜치:* `${{ github.ref_name }}`\n*작업자:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "워크플로우 보기" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
